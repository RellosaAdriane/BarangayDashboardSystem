<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayPOB-3A ERD Preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9eef4; color: #24364b; font: 15px Arial, Helvetica, sans-serif; }
    header { position: sticky; top: 0; padding: 14px 22px; background: #183b5b; color: white; box-shadow: 0 2px 8px #10283c30; }
    header strong { font-size: 17px; }
    main { padding: 18px; }
    .canvas { max-width: 1500px; margin: 0 auto; background: white; box-shadow: 0 3px 18px #183b5b22; overflow: auto; }
    img { display: block; width: 100%; height: auto; min-width: 900px; }
    @media (max-width: 920px) { main { padding: 8px; } img { width: 1200px; max-width: none; } }
  </style>
</head>
<body>
  <header><strong>BarangayPOB-3A — ERD</strong></header>
  <main><div class="canvas"><img src="barangay-dashboard-erd.svg" alt="Entity relationship diagram for BarangayPOB-3A"></div></main>
</body>
</html>
